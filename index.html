<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินและเกณฑ์การนำส่งผู้ป่วย (Inter-hospital Transport Checklist)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            .container-box {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6 md:p-8 container-box">
        <!-- Header -->
        <div class="border-b pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">แบบประเมินและเกณฑ์การนำส่งผู้ป่วย</h1>
            <p class="text-gray-600 text-sm mt-1">Inter-hospital & Intra-hospital Transport Assessment Checklist</p>
        </div>

        <form id="transportForm" class="space-y-6">
            <!-- Patient Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล ผู้ป่วย</label>
                    <input type="text" id="patientName" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">อายุ (ปี)</label>
                    <input type="number" id="patientAge" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ย้ายจาก (Ward/Dept)</label>
                    <input type="text" id="fromWard" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ไปยัง (Ward/Dept/Hospital)</label>
                    <input type="text" id="toWard" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">วัน-เวลา ที่ประเมิน</label>
                    <input type="datetime-local" id="assessDateTime" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ผู้ประเมิน</label>
                    <input type="text" id="assessorName" class="mt-1 w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <!-- Clinical Items Assessment -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">รายการประเมินสภาวะผู้ป่วย</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- SpO2 -->
                    <div class="p-3 border rounded-lg">
                        <label class="block text-sm font-medium text-gray-700 mb-1">SpO2 (%)</label>
                        <input type="number" id="o2_psi" oninput="calculateRisk()" placeholder="ระบุค่า SpO2" class="w-full border border-gray-300 rounded-md p-2">
                    </div>

                    <!-- GCS -->
                    <div class="p-3 border rounded-lg">
                        <label class="block text-sm font-medium text-gray-700 mb-1">GCS Score (3-15)</label>
                        <input type="number" id="gcs_score" min="3" max="15" oninput="calculateRisk()" placeholder="ระบุ GCS" class="w-full border border-gray-300 rounded-md p-2">
                    </div>

                    <!-- Oxygen Support -->
                    <div class="p-3 border rounded-lg">
                        <label class="block text-sm font-medium text-gray-700 mb-1">การให้ออกซิเจน</label>
                        <select id="o2_support" onchange="calculateRisk()" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="none">Room Air (ไม่ใช้ออกซิเจน)</option>
                            <option value="low">Low Flow (Cannula / Mask)</option>
                            <option value="high">High Flow / ETT / Ventilator</option>
                        </select>
                    </div>

                    <!-- Vasoactive Drugs -->
                    <div class="p-3 border rounded-lg">
                        <label class="block text-sm font-medium text-gray-700 mb-1">ยากระตุ้นความดัน (Vasoactive drug)</label>
                        <select id="vasoactive" onchange="calculateRisk()" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="none">ไม่มีการใช้ยา</option>
                            <option value="single">ใช้ยา 1 ตัว (Dopamine/Norepinephrine ฯลฯ)</option>
                            <option value="multiple">ใช้ยา >= 2 ตัว หรือปรับ Dose ต่อเนื่อง</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Result Summary Box -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 mt-6">
                <h3 class="text-md font-bold text-blue-900 mb-2">สรุปผลการประเมินทีมนำส่ง (Escort Team Requirement)</h3>
                <div class="text-2xl font-extrabold text-blue-700 mb-3" id="final_escort">กรุณากรอกข้อมูลเพื่อประเมิน</div>
                <div class="text-sm text-gray-600 border-t border-blue-200 pt-2" id="res_counts">
                    รายละเอียดสภาวะความเสี่ยง: -
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3 no-print">
                <button type="button" onclick="handleSaveAndPrint('save')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition text-center">
                    💾 บันทึกข้อมูล (Save)
                </button>
                <button type="button" onclick="handleSaveAndPrint('print')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition text-center">
                    🖨️ บันทึกและพิมพ์ (Save & Print)
                </button>
            </div>
        </form>
    </div>

    <!-- Script Section -->
    <script>
        // Web App URL จาก Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySbWokTe5TUZZaFCr5IhROt6789N4d9cy9BdwnmKWQHKwIHdbfMZk9zbxAcUzAJ4MG/exec';

        // คำนวณความเสี่ยงและทีมนำส่งอัตโนมัติ
        function calculateRisk() {
            const spo2 = parseFloat(document.getElementById('o2_psi').value);
            const gcs = parseFloat(document.getElementById('gcs_score').value);
            const o2Support = document.getElementById('o2_support').value;
            const vasoactive = document.getElementById('vasoactive').value;

            let highRiskCount = 0;
            let moderateRiskCount = 0;

            // ตรวจสอบเงื่อนไข High Risk
            if (spo2 && spo2 < 92) highRiskCount++;
            if (gcs && gcs <= 8) highRiskCount++;
            if (o2Support === 'high') highRiskCount++;
            if (vasoactive === 'multiple') highRiskCount++;

            // ตรวจสอบเงื่อนไข Moderate Risk
            if (spo2 && spo2 >= 92 && spo2 <= 95) moderateRiskCount++;
            if (gcs && gcs >= 9 && gcs <= 12) moderateRiskCount++;
            if (o2Support === 'low') moderateRiskCount++;
            if (vasoactive === 'single') moderateRiskCount++;

            // ประเมินบุคลากรนำส่ง
            let escortText = "";
            if (highRiskCount > 0) {
                escortText = "🔴 แพทย์ + พยาบาลวิกฤต (Critical Care Team)";
            } else if (moderateRiskCount > 0) {
                escortText = "🟡 พยาบาลวิชาชีพ (Registered Nurse)";
            } else {
                escortText = "🟢 พนักงานช่วยเหลือผู้ป่วย / พยาบาล (Basic Escort)";
            }

            document.getElementById('final_escort').innerText = escortText;
            document.getElementById('res_counts').innerText = `ความเสี่ยงสูง (High Risk): ${highRiskCount} รายการ | ความเสี่ยงปานกลาง (Moderate Risk): ${moderateRiskCount} รายการ`;
        }

        // ส่งข้อมูลไปยัง Google Apps Script
        async function sendDataToGoogleSheet() {
            const payload = {
                timestamp: new Date().toLocaleString('th-TH'),
                patientName: document.getElementById('patientName')?.value || '',
                patientAge: document.getElementById('patientAge')?.value || '',
                fromWard: document.getElementById('fromWard')?.value || '',
                toWard: document.getElementById('toWard')?.value || '',
                assessDateTime: document.getElementById('assessDateTime')?.value || '',
                assessorName: document.getElementById('assessorName')?.value || '',
                finalEscort: document.getElementById('final_escort')?.innerText || '',
                counts: document.getElementById('res_counts')?.innerText || ''
            };

            try {
                // ใช้ mode: 'no-cors' เพื่อข้ามปัญหา CORS ของ Google Apps Script
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return true;
            } catch (err) {
                console.error('Error saving data:', err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเพื่อบันทึกข้อมูล');
                return false;
            }
        }

        // จัดการการกดปุ่ม Save / Print
        async function handleSaveAndPrint(action) {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = 'กำลังบันทึกข้อมูล...';
            btn.disabled = true;

            const success = await sendDataToGoogleSheet();
            
            btn.innerText = originalText;
            btn.disabled = false;

            if (success) {
                if (action === 'print') {
                    window.print();
                } else {
                    alert('บันทึกข้อมูลเรียบร้อยแล้ว');
                }
            }
        }

        // ตั้งค่า datetime-local เป็นปัจจุบันโดยอัตโนมัติ
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('assessDateTime').value = now.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
